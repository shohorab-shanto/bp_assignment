version: '3.8'

services:
  app:
    build: .
    container_name: laravel-app
    ports:
      - "8080:8080"
    environment:
      APP_ENV: local
      APP_DEBUG: true
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: assignment-ecom
      DB_USERNAME: root
      DB_PASSWORD: rootpassword
    volumes:
      - ./:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.2
    container_name: laravel-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: assignment-ecom
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata:
